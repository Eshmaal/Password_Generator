<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="../password generator/pg.css" />
  </head>
  <body>
      <div id="container">
        <h1>Password Generator</h1>
        <label for="">Password length: <span id="num">10</span></label>
        <input type="range" name="" id="range" value="10"  min="6" max="20"/>
        <input type="text" name="" id="password" readonly placeholder="Your Password" />
        <div id="settings">
          <label>
            <input type="checkbox" id="upper" checked/>
            Uppercase Letters(A-Z)
            </label> 
          <label>
            <input type="checkbox" id="lower" checked/>
            Lowercase Letters(a-z)
            </label> 
            <label>
            <input type="checkbox" id="numbers" checked/>
            Numbers(0-9)
            </label> 
            <label>
            <input type="checkbox" id="symbols" checked/>
            Symbols
            </label> 
        </div>
        <button onclick="genpass()" id="gen-btn">Generate</button>
        <button onclick="copypass()" id="copy-btn">Copy</button>
      </div>
      <script src="../password generator/pg.js"></script>
  </body>
</html>
